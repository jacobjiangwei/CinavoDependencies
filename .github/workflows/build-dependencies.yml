name: Build Apple FFmpeg

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New immutable FFmpeg version, for example 2026.10.08.2"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: apple-dependencies-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      JOBS: "4"
    steps:
      - name: Check out build recipes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate version and build environment
        run: |
          python3 - <<'PY'
          import os
          import json
          import re
          import subprocess
          import sys
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,63}", os.environ["RELEASE_VERSION"]):
              raise ValueError("Use a new dependency version without path separators.")
          if sys.version_info < (3, 12):
              raise RuntimeError("Packaging requires Python 3.12 or newer.")
          with open("dependencies.json") as source:
              platforms = json.load(source)["ffmpeg"]["platforms"]
          for platform in platforms:
              version = subprocess.check_output(
                  ["xcrun", "--sdk", platform, "--show-sdk-version"], text=True
              ).strip()
              if int(version.split(".")[0]) < 26:
                  raise RuntimeError(f"{platform} SDK 26 or newer is required.")
          PY
          xcodebuild -version

      - name: Compile static LGPL FFmpeg for all seven Apple SDK variants
        run: bash scripts/build_ffmpeg.sh

      - name: Package and verify FFmpeg
        run: |
          python3 scripts/package_dependencies.py --version "$RELEASE_VERSION"

      - name: Publish immutable dependency Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/cinavo-ffmpeg-${RELEASE_VERSION}.tar.gz"
          source=".build/ffmpeg/ffmpeg-7.1.3.tar.xz"
          gh release create "deps-${RELEASE_VERSION}" \
            "$archive" "$archive.sha256" "$archive.manifest.json" "$source" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Cinavo Apple FFmpeg ${RELEASE_VERSION}" \
            --notes "FFmpeg 7.1.3 built from verified LGPL source on GitHub Actions for arm64 macOS and iOS/tvOS/visionOS devices and simulators. Includes 35 static libraries across seven SDK variants, headers, LGPL notices, per-file manifest, archive SHA-256 and exact corresponding FFmpeg source. No CocoaPods, VLC frameworks, application code, model weights or debug symbols."
